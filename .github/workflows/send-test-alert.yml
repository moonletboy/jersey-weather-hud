# Send a test warning alert - to the OWNER'S device(s) only
#
# GitHub > Actions > "Send test alert" > "Run workflow", type a message, Run.
# It goes only to devices that subscribed while the site was open with #admin
# on the end of the address (www.jerseyweatherchat.com/index.html#admin), so
# the community never sees a test. Uses the same secrets as "Warning alerts".

name: Send test alert

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Test message to send"
        required: false
        default: "This is a test of the Jersey Weather Chat warning alerts."

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests pywebpush

      - name: Send the test
        env:
          MODE: test
          TEST_MESSAGE: ${{ inputs.message }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          JWC_ADMIN_KEY: ${{ secrets.JWC_ADMIN_KEY }}
        run: python scripts/warning_alerts.py

      - name: Publish the public key if it is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push-config.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Warning alerts: publish public key"
          git pull --rebase origin main && git push origin HEAD:main
