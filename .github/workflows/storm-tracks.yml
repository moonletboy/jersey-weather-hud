# Storm tracks for the Jersey Weather Chat HUD
#
# NOAA publishes a new GFS forecast run every 6 hours. GitHub's scheduler is
# "best effort" - it often starts jobs hours late or skips them altogether - so
# this job is triggered SEVERAL times after each run is due (about 05:27, 06:27,
# 07:27 UTC, and the same again after the 12, 18 and 00 UTC runs). Each trigger
# first checks, in a few seconds, whether the newest complete NOAA run is already
# in data/storm-tracks.json. If it is, it stops; if not, it does the full build.
# So a dropped trigger no longer leaves the Storm Tracker a whole cycle behind.
#
# You can also run it by hand any time: GitHub > Actions > "Storm tracks" >
# "Run workflow".
#
# To NAME a storm by hand (or fix a wrong automatic name) use the same
# "Run workflow" form: type the storm NUMBER shown on the map (e.g. 7) and the
# name, and choose what to do:
#   set name         - this is the storm's name (replaces any name it had)
#   also known as    - add a second name (e.g. the German name for a storm the
#                      UK Met Office already named)
#   clear name       - go back to showing just the number

name: Storm tracks

on:
  schedule:
    # NOAA's four daily runs (00/06/12/18 UTC) are complete about 4-5 hours later.
    # Extra triggers are harmless: they stop early if the data is already current.
    - cron: "27 5,6,7,11,12,13,17,18,19,23,0,1 * * *"
  workflow_dispatch:
    inputs:
      storm_number:
        description: "Storm NUMBER shown on the map (leave empty for a normal update)"
        required: false
        default: ""
      storm_name:
        description: "Name to give it, e.g. Austen"
        required: false
        default: ""
      storm_action:
        description: "What to do with the name"
        required: false
        default: "set"
        type: choice
        options:
          - set
          - aka
          - clear
      storm_group:
        description: "Who named it (shown on the page)"
        required: false
        default: "MANUAL"
        type: choice
        options:
          - MANUAL
          - UK / IRELAND / NETHERLANDS
          - FRANCE / SPAIN / PORTUGAL
          - GERMANY (DWD / FU BERLIN)

permissions:
  contents: write

concurrency:
  group: storm-tracks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Check whether a new NOAA run is waiting
        id: check
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          B = "https://noaa-gfs-bdp-pds.s3.amazonaws.com"
          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(minute=0, second=0, microsecond=0)
          base -= dt.timedelta(hours=base.hour % 6)
          latest = None
          for k in range(6):
              c = base - dt.timedelta(hours=6 * k)
              h = c.strftime("%H")
              url = "%s/gfs.%s/%s/atmos/gfs.t%sz.pgrb2.0p50.f240.idx" % (B, c.strftime("%Y%m%d"), h, h)
              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status == 200:
                          latest = c
                          break
              except Exception:
                  pass
          have = None
          try:
              have = json.load(open("data/storm-tracks.json")).get("cycle")
          except Exception:
              pass
          want = latest.strftime("%Y-%m-%dT%H:00:00Z") if latest else None
          print("Newest complete NOAA run:", want, "| in storm-tracks.json:", have)
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          go = manual or latest is None or want != have
          print("Manual run - building." if manual else ("Building." if go else "Already current - nothing to do."))
          open(os.environ["GITHUB_OUTPUT"], "a").write("build=%s\n" % ("true" if go else "false"))
          PY

      - name: Set up Python
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: steps.check.outputs.build == 'true'
        run: pip install numpy scipy requests eccodes

      - name: Find the storm centres
        if: steps.check.outputs.build == 'true'
        env:
          STORM_SET_NUM: ${{ inputs.storm_number }}
          STORM_SET_NAME: ${{ inputs.storm_name }}
          STORM_SET_MODE: ${{ inputs.storm_action }}
          STORM_SET_GROUP: ${{ inputs.storm_group }}
        run: python scripts/storm_tracks.py

      - name: Save the result
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/storm-tracks.json
          git add data/storm-registry.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update storm tracks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
