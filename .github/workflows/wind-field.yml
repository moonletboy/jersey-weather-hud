# Wind-field map data for the Jersey Weather Chat HUD
#
# Every 6 hours (about 20 minutes after the "Storm tracks" job) this downloads
# NOAA's 0.25-degree forecast wind-gust, wind and pressure maps, trims them to
# the Storm Tracker's map window and builds data/wind-field.json. The Storm
# Tracker map on the website reads that file to paint the wind shading and the
# pressure lines.
#
# Since November 2026 the same run also saves the jet stream (the wind about
# 10 km up, 250 hPa) over the North Atlantic and Europe as jet-stream.json, for
# the JET STREAM pop-up on Live Ops. If the jet maps can't be had, the wind map
# is published as normal and the previous jet-stream.json is kept.
#
# The file is published on a separate branch called "data", as ONE commit that
# is replaced each run, so the main branch does not grow four times a day. The
# website reads it from
#   https://raw.githubusercontent.com/moonletboy/jersey-weather-hud/data/wind-field.json
# and falls back to the old copy in data/ on main if that is unreachable.
# The jet stream is read from
#   https://raw.githubusercontent.com/moonletboy/jersey-weather-hud/data/jet-stream.json
#
# You can also run it by hand any time: GitHub > Actions > "Wind field" >
# "Run workflow".

name: Wind field

on:
  schedule:
    - cron: "47 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-field
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install numpy scipy requests eccodes

      - name: Build the wind field and the jet stream
        run: python scripts/wind_field.py --out out/wind-field.json --jet-out out/jet-stream.json

      - name: Publish on the data branch
        run: |
          if [ ! -s out/wind-field.json ]; then
            echo "No file was built - leaving the data branch as it is."
            exit 0
          fi
          mkdir -p publish && cp out/wind-field.json publish/
          if [ -s out/jet-stream.json ]; then
            cp out/jet-stream.json publish/
          else
            echo "No new jet-stream file this time - keeping the previous one if there is one."
            curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/jet-stream.json" -o publish/jet-stream.json || rm -f publish/jet-stream.json
          fi
          cd publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Wind-field and jet-stream data for the Jersey Weather Chat HUD. Rebuilt every 6 hours by the Wind field action; history is not kept." > README.md
          git add wind-field.json README.md
          if [ -s jet-stream.json ]; then
            git add jet-stream.json
          fi
          git commit -q -m "Wind field $(date -u +'%Y-%m-%d %H:%MZ')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
