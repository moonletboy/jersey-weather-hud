# Wind-field map data for the Jersey Weather Chat HUD
#
# Each time NOAA publishes a new run (every 6 hours) this downloads
# NOAA's 0.25-degree forecast wind-gust, wind and pressure maps, trims them to
# the Storm Tracker's map window and builds data/wind-field.json. The Storm
# Tracker map on the website reads that file to paint the wind shading and the
# pressure lines.
#
# GitHub's scheduler often starts jobs hours late or skips them, so this is
# triggered several times after each run is due. Each trigger first checks
# whether the newest complete NOAA run is already on the data branch and stops
# in a few seconds if it is, so extra triggers cost almost nothing.
#
# Since November 2026 the same run also saves the jet stream (the wind about
# 10 km up, 250 hPa) over the North Atlantic and Europe as jet-stream.json, for
# the JET STREAM pop-up on Live Ops. If the jet maps can't be had, the wind map
# is published as normal and the previous jet-stream.json is kept.
#
# The file is published on a separate branch called "data", as ONE commit that
# is replaced each run, so the main branch does not grow four times a day. The
# website reads it from
#   https://raw.githubusercontent.com/moonletboy/jersey-weather-hud/data/wind-field.json
# and falls back to the old copy in data/ on main if that is unreachable.
# The jet stream is read from
#   https://raw.githubusercontent.com/moonletboy/jersey-weather-hud/data/jet-stream.json
#
# You can also run it by hand any time: GitHub > Actions > "Wind field" >
# "Run workflow".

name: Wind field

on:
  schedule:
    - cron: "47 5,6,7,11,12,13,17,18,19,23,0,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wind-field
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Check whether a new NOAA run is waiting
        id: check
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          B = "https://noaa-gfs-bdp-pds.s3.amazonaws.com"
          now = dt.datetime.now(dt.timezone.utc)
          base = now.replace(minute=0, second=0, microsecond=0)
          base -= dt.timedelta(hours=base.hour % 6)
          latest = None
          for k in range(6):
              c = base - dt.timedelta(hours=6 * k)
              h = c.strftime("%H")
              url = "%s/gfs.%s/%s/atmos/gfs.t%sz.pgrb2.0p25.f240.idx" % (B, c.strftime("%Y%m%d"), h, h)
              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status == 200:
                          latest = c
                          break
              except Exception:
                  pass
          have = None
          try:
              repo = os.environ["GITHUB_REPOSITORY"]
              u = "https://raw.githubusercontent.com/%s/data/wind-field.json?nc=%d" % (repo, int(now.timestamp()))
              with urllib.request.urlopen(u, timeout=60) as r:
                  have = json.load(r).get("cycle")
          except Exception as e:
              print("Could not read the published file (%s) - will build." % e)
          want = latest.strftime("%Y-%m-%dT%H:00:00Z") if latest else None
          print("Newest complete NOAA run:", want, "| on data branch:", have)
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          go = manual or latest is None or want != have
          print("Manual run - building." if manual else ("Building." if go else "Already current - nothing to do."))
          open(os.environ["GITHUB_OUTPUT"], "a").write("build=%s\n" % ("true" if go else "false"))
          PY

      - name: Set up Python
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: steps.check.outputs.build == 'true'
        run: pip install numpy scipy requests eccodes

      - name: Build the wind field and the jet stream
        if: steps.check.outputs.build == 'true'
        run: python scripts/wind_field.py --out out/wind-field.json --jet-out out/jet-stream.json

      - name: Publish on the data branch
        if: steps.check.outputs.build == 'true'
        run: |
          if [ ! -s out/wind-field.json ]; then
            echo "No file was built - leaving the data branch as it is."
            exit 0
          fi
          mkdir -p publish && cp out/wind-field.json publish/
          if [ -s out/jet-stream.json ]; then
            cp out/jet-stream.json publish/
          else
            echo "No new jet-stream file this time - keeping the previous one if there is one."
            curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/jet-stream.json" -o publish/jet-stream.json || rm -f publish/jet-stream.json
          fi
          cd publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Wind-field and jet-stream data for the Jersey Weather Chat HUD. Rebuilt every 6 hours by the Wind field action; history is not kept." > README.md
          git add wind-field.json README.md
          if [ -s jet-stream.json ]; then
            git add jet-stream.json
          fi
          git commit -q -m "Wind field $(date -u +'%Y-%m-%d %H:%MZ')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
