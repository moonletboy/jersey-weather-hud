# Jersey Met warning alerts for the Jersey Weather Chat HUD
#
# Every 10 minutes this asks the Apps Script for the current gov.je warnings
# (the script caches them, so this costs no ZenRows credits), compares with
# data/warnings-state.json and sends a push notification to every device that
# tapped ALERT ME - but only when a warning is NEW or UPGRADED. Nothing is sent
# when a warning is reworded at the same colour, lowered or cleared.
#
# It also publishes data/push-config.json (the public key the ALERT ME bar
# needs); the bar on the website stays hidden until that file exists.
#
# Needs four repository secrets: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY,
# VAPID_SUBJECT (mailto:your@email) and JWC_ADMIN_KEY (same as the Apps Script
# ADMIN_KEY script property).
#
# GitHub schedules are not exact - runs can be a few minutes late when GitHub
# is busy. You can also run it by hand: Actions > "Warning alerts" > Run workflow.

name: Warning alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warning-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests pywebpush

      - name: Check warnings and send alerts
        env:
          MODE: check
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          JWC_ADMIN_KEY: ${{ secrets.JWC_ADMIN_KEY }}
        run: python scripts/warning_alerts.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warnings-state.json data/push-config.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Warning alerts: state $(date -u +'%Y-%m-%d %H:%MZ')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (another job may have saved at the same moment) - trying again."
            sleep 5
          done
          exit 1
