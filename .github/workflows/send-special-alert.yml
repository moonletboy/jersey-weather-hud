# Send a special alert - your own push notification to subscribers
#
# GitHub > Actions > "Send special alert" > "Run workflow", then:
#   Who gets it   - "Me only (test)" first, to see how it looks on your device;
#                   then run again with "EVERYONE" to send to all subscribers.
#   Title         - the bold first line of the notification (keep it short)
#   Message       - one or two sentences; phones show about 2-4 lines
#   Also banner   - tick to ALSO put the message up as the red SPECIAL WEATHER
#                   MESSAGE panel on the site (same as the "Special weather message"
#                   workflow). Only happens when sending to EVERYONE.
#   Signed by     - name shown under the banner message
#   Log id        - leave empty (Storm Watch fills this in when you approve an email)
#
# Every send is recorded in the AlertLog tab of your Google Sheet once Storm Watch
# is set up. Uses the same secrets as "Warning alerts".

name: Send special alert

on:
  workflow_dispatch:
    inputs:
      audience:
        description: "Who gets it"
        required: true
        default: "Me only (test)"
        type: choice
        options:
          - "Me only (test)"
          - "EVERYONE (all subscribers)"
      title:
        description: "Title (bold first line)"
        required: true
        default: "Jersey Weather Chat"
      message:
        description: "Message (one or two sentences)"
        required: true
        default: ""
      also_banner:
        description: "Also show it as the red banner on the site (EVERYONE only)"
        required: false
        default: false
        type: boolean
      signed:
        description: "Signed by (banner only)"
        required: false
        default: "Ops system"
      log_id:
        description: "Log id (leave empty)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: special-alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests pywebpush

      - name: Send the alert
        env:
          MODE: special
          AUDIENCE: ${{ startsWith(inputs.audience, 'EVERYONE') && 'all' || 'owner' }}
          SPECIAL_TITLE: ${{ inputs.title }}
          SPECIAL_BODY: ${{ inputs.message }}
          LOG_ID: ${{ inputs.log_id }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          JWC_ADMIN_KEY: ${{ secrets.JWC_ADMIN_KEY }}
        run: python scripts/warning_alerts.py

      - name: Also put it up as the site banner
        if: ${{ format('{0}', inputs.also_banner) == 'true' && startsWith(inputs.audience, 'EVERYONE') }}
        env:
          MSG_TEXT: ${{ inputs.message }}
          MSG_SIGNED: ${{ inputs.signed }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          text = " ".join(os.environ.get("MSG_TEXT", "").split())
          signed = " ".join(os.environ.get("MSG_SIGNED", "").split())[:60] or "Ops system"
          data = {"active": True, "text": text, "signed": signed,
                  "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
          os.makedirs("data", exist_ok=True)
          with open("data/special-message.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=1)
          print("Banner saved:", json.dumps(data, ensure_ascii=False))
          PYEOF

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/special-message.json data/push-config.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git commit -m "Special alert: banner updated"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (another job may have saved at the same moment) - trying again."
            sleep 5
          done
          exit 1
