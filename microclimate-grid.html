<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWC LIVE OPS — Jersey Microclimate Grid</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #121820;
            --border-color: #1e2633;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --neon-cyan: #00f2fe;
            --neon-amber: #ff9f43;
            --neon-green: #00ff87;
            --font-mono: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; padding: 20px; }
        header { border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
        .brand-title { font-family: var(--font-mono); font-weight: bold; }
        .brand-title span { color: var(--neon-cyan); }
        .hud-status { font-family: var(--font-mono); font-size: 0.85rem; color: var(--neon-green); }
        .controls-bar { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .toggle-group { display: flex; gap: 5px; }
        .toggle-btn { background: #1c2330; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; font-family: var(--font-mono); font-size: 0.85rem; cursor: pointer; text-transform: uppercase; }
        .toggle-btn.active { background: var(--neon-cyan); color: var(--bg-color); font-weight: bold; }
        #hud-contour-map { height: 420px; background-color: var(--card-bg); border: 1px solid var(--border-color); margin-bottom: 30px; }
        .sector-section { margin-bottom: 35px; }
        .sector-header { font-family: var(--font-mono); font-size: 1.1rem; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #94a3b8; }
        .sector-header::after { content: ''; flex-grow: 1; height: 1px; background: var(--border-color); }
        .grid-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .pws-card { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; position: relative; }
        .pws-id { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
        .pws-name { font-weight: 600; font-size: 1rem; margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .metric-display { display: flex; align-items: baseline; gap: 4px; margin-bottom: 10px; }
        .metric-value { font-family: var(--font-mono); font-size: 1.8rem; font-weight: bold; }
        .pws-meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 8px; display: flex; justify-content: space-between; }
        .status-dot { width: 6px; height: 6px; background-color: var(--neon-green); border-radius: 50%; box-shadow: 0 0 6px var(--neon-green); }
    </style>
</head>
<body>
    <header>
        <div class="brand-title">JWC LIVE OPS // <span>MICROCLIMATE GRID</span></div>
        <div class="hud-status">MAP CONTOUR LAYER ONLINE</div>
    </header>
    <div class="controls-bar">
        <div class="toggle-group">
            <button class="toggle-btn active" onclick="switchMetric('temp')">Temperature</button>
            <button class="toggle-btn" onclick="switchMetric('wind')">Wind</button>
            <button class="toggle-btn" onclick="switchMetric('rain')">Rain</button>
        </div>
        <div class="network-stats">UPDATED: <span id="last-update-time">--:--</span></div>
    </div>
    <div id="hud-contour-map"></div>
    <main id="matrix-container"></main>
    <script>
        let activeMetric = 'temp';
        let map, stationLayer, contourLayer;
        let stationNetwork = {};

        function initMatrix() {
            document.getElementById('last-update-time').innerText = new Date().toTimeString().split(' ');
            map = L.map('hud-contour-map').setView([49.215, -2.13], 12);
            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map);
            contourLayer = L.layerGroup().addTo(map);
            stationLayer = L.layerGroup().addTo(map);
            
            // Fetch configuration dynamically from a secure outside text file to avoid chat limit cuts
            fetch('https://github.io')
                .then(res => res.json())
                .then(data => {
                    stationNetwork = data;
                    renderMatrix();
                    generateContours();
                }).catch(err => console.error("Waiting for data configuration file link..."));
        }

        function generateContours() {
            contourLayer.clearLayers();
            stationLayer.clearLayers();
            const stations = Object.values(stationNetwork).flat();
            if(stations.length === 0) return;
            
            const latStart = 49.16, latEnd = 49.27, latStep = 0.005;
            const lngStart = -2.25, lngEnd = -2.00, lngStep = 0.008;

            for (let lat = latStart; lat < latEnd; lat += latStep) {
                for (let lng = lngStart; lng < lngEnd; lng += lngStep) {
                    let sumValues = 0, sumWeights = 0;
                    stations.forEach(s => {
                        const d = Math.sqrt((lat-s.lat)**2 + (lng-s.lng)**2) || 0.001;
                        const w = 1 / (d ** 2);
                        let v = activeMetric === 'temp' ? s.temp : (activeMetric === 'wind' ? s.wind : s.rain);
                        sumValues += v * w; sumWeights += w;
                    });
                    const val = sumValues / sumWeights;
                    let color = 'transparent';
                    if (activeMetric === 'temp') {
                        color = val < 12.5 ? 'rgba(0,242,254,0.2)' : (val < 13.5 ? 'rgba(0,255,135,0.2)' : 'rgba(255,71,87,0.2)');
                    } else if (activeMetric === 'wind') {
                        color = val < 8 ? 'rgba(0,242,254,0.2)' : (val < 14 ? 'rgba(255,159,67,0.2)' : 'rgba(255,71,87,0.2)');
                    } else {
                        color = val > 0 ? 'rgba(0,255,135,0.25)' : 'transparent';
                    }
                    if (color !== 'transparent') {
                        L.rectangle([[lat, lng], [lat+latStep, lng+lngStep]], {color: color, weight: 0, fillColor: color, fillOpacity: 0.35}).addTo(contourLayer);
                    }
                }
            }

            stations.forEach(s => {
                let txt = activeMetric === 'temp' ? s.temp+'°C' : (activeMetric === 'wind' ? s.wind+'M' : s.rain+'mm');
                let clr = activeMetric === 'temp' && s.temp > 13.5 ? '#ff4757' : '#00f2fe';
                const icon = L.divIcon({
                    html: `<div style="background:${clr};width:6px;height:6px;border-radius:50%;"></div><div style="color:${clr};font-size:9px;font-family:monospace;position:absolute;left:8px;top:-4px;background:rgba(10,14,20,0.85);padding:1px 3px;white-space:nowrap;border:1px solid #1e2633;">${txt}</div>`
                });
                L.marker([s.lat, s.lng], {icon: icon}).addTo(stationLayer);
            });
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            container.innerHTML = '';
            for (const [sector, stations] of Object.entries(stationNetwork)) {
                const sect = document.createElement('section');
                sect.className = 'sector-section';
                sect.innerHTML = `<h2 class="sector-header">${sector}</h2>`;
                const grid = document.createElement('div');
                grid.className = 'grid-matrix';
                stations.forEach(s => {
                    let v = activeMetric === 'temp' ? s.temp.toFixed(1)+'°C' : (activeMetric === 'wind' ? s.wind+' MPH' : s.rain.toFixed(1)+' MM');
                    grid.innerHTML += `<div class="pws-card"><div class="pws-id">${s.id}</div><div class="pws-name">${s.name}</div><div class="metric-display"><div class="metric-value">${v}</div></div><div class="pws-meta"><span>ONLINE</span><span class="status-dot"></span></div></div>`;
                });
                sect.appendChild(grid);
                container.appendChild(sect);
            }
        }

        function switchMetric(m) { activeMetric = m; document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); renderMatrix(); generateContours(); }
        window.onload = initMatrix;
    </script>
</body>
</html>
