<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWC LIVE OPS — Jersey Microclimate Grid</title>
    
    <!-- LEAFLET MAP ENGINE ASSETS -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #121820;
            --border-color: #1e2633;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --neon-cyan: #00f2fe;
            --neon-amber: #ff9f43;
            --neon-green: #00ff87;
            --neon-red: #ff4757;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 20px;
            line-height: 1.5;
        }

        /* Tactical Header Block */
        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .brand-title {
            font-family: var(--font-mono);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .brand-title span {
            color: var(--neon-cyan);
        }

        .hud-status {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--neon-green);
            text-transform: uppercase;
        }

        /* Master Controls */
        .controls-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .toggle-group {
            display: flex;
            gap: 5px;
        }

        .toggle-btn {
            background: #1c2330;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: var(--neon-cyan);
            color: var(--bg-color);
            border-color: var(--neon-cyan);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .toggle-btn:hover:not(.active) {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .network-stats {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Tactical Map Workspace */
        #hud-contour-map {
            height: 450px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* Sector Layout */
        .sector-section {
            margin-bottom: 35px;
        }

        .sector-header {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
        }

        .sector-header::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--border-color);
        }

        .grid-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        /* PWS Station Cards */
        .pws-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            position: relative;
            transition: border-color 0.2s ease;
        }

        .pws-card:hover {
            border-color: #2e3c51;
        }

        .pws-id {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .pws-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .metric-display {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1;
        }

        .metric-unit {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .pws-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px var(--neon-green);
        }

        .stale .status-dot {
            background-color: var(--neon-amber);
            box-shadow: 0 0 6px var(--neon-amber);
        }

        /* Responsive Fixes */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .toggle-group {
                flex-direction: column;
            }
            #hud-contour-map {
                height: 320px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">JWC LIVE OPS // <span>MICROCLIMATE MATRIX</span></div>
        <div class="hud-status"><span class="status-dot"></span> FEED: ACTIVE (40 STATIONS)</div>
    </header>

    <div class="controls-bar">
        <div class="toggle-group">
            <button class="toggle-btn active" onclick="switchMetric('temp')">Temperature</button>
            <button class="toggle-btn" onclick="switchMetric('wind')">Wind / Gust</button>
            <button class="toggle-btn" onclick="switchMetric('rain')">Rain Today</button>
        </div>
        <div class="network-stats">
            UPDATED: <span id="last-update-time">--:--:--</span> | SOURCE: WUNDERGROUND PWS
        </div>
    </div>

    <!-- LIVE CONTOUR WEATHER MAP CANVAS -->
    <div id="hud-contour-map"></div>

    <!-- Main Grid Workspace Container -->
    <main id="matrix-container"></main>

                { id: "ISAINT5010", name: "Trinity Pallot Steam", lat: 49.227, lng: -2.096, temp: 12.7, wind: 9, gust: 13, rain: 0.0, stale: false }
            ],
            "Sheltered East & Plains (St. Martin / Grouville / St. Lawrence)": [
                { id: "ISAINT6001", name: "St Martin Gorey Castle", lat: 49.200, lng: -2.019, temp: 13.8, wind: 10, gust: 14, rain: 0.0, stale: false },
                { id: "ISAINT6002", name: "Grouville Royal Bay", lat: 49.191, lng: -2.030, temp: 14.0, wind: 9, gust: 13, rain: 0.0, stale: false },
                { id: "ISAINT6003", name: "St Lawrence Millbrook", lat: 49.197, lng: -2.138, temp: 13.6, wind: 7, gust: 10, rain: 0.0, stale: false },
                { id: "ISAINT6004", name: "St Martin Village", lat: 49.221, lng: -2.046, temp: 13.1, wind: 8, gust: 11, rain: 0.0, stale: false },
                { id: "ISAINT6005", name: "Grouville Marsh", lat: 49.198, lng: -2.048, temp: 12.9, wind: 5, gust: 8, rain: 0.0, stale: false },
                { id: "ISAINT6006", name: "St Lawrence Church", lat: 49.213, lng: -2.141, temp: 13.2, wind: 7, gust: 11, rain: 0.0, stale: false },
                { id: "ISAINT6007", name: "St Catherine Breakwater", lat: 49.223, lng: -2.016, temp: 13.9, wind: 12, gust: 16, rain: 0.0, stale: false },
                { id: "ISAINT6008", name: "Queen's Valley", lat: 49.207, lng: -2.051, temp: 12.5, wind: 4, gust: 6, rain: 0.0, stale: false },
                { id: "ISAINT6009", name: "St Lawrence Carrefour", lat: 49.231, lng: -2.132, temp: 13.0, wind: 8, gust: 12, rain: 0.0, stale: false },
                { id: "ISAINT6010", name: "Faldouet", lat: 49.211, lng: -2.036, temp: 13.4, wind: 9, gust: 13, rain: 0.0, stale: false }
            ]
        };

        let activeMetric = 'temp';
        let map;
        let stationMarkersLayer;

        function initMatrix() {
            const timeSpan = document.getElementById('last-update-time');
            const now = new Date();
            timeSpan.innerText = now.toTimeString().split(' ');
            
            // MAP SETUP: Focuses perfectly on Jersey
            map = L.map('hud-contour-map', {
                center: [49.215, -2.13],
                zoom: 12,
                minZoom: 11,
                maxZoom: 14,
                zoomControl: true
            });

            // Dark-Mode Tactical Map Skin
            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(map);

            stationMarkersLayer = L.layerGroup().addTo(map);

            renderMatrix();
            updateMapLayers();
        }

        function updateMapLayers() {
            // Clear prior physical station plotting dots
            stationMarkersLayer.clearLayers();

            // Loop and plot each station onto the map view canvas
            for (const [sector, stations] of Object.entries(stationNetwork)) {
                stations.forEach(station => {
                    let dispVal = '';
                    let color = '#00f2fe'; // Default neon cyan

                    if (activeMetric === 'temp') {
                        dispVal = `${station.temp.toFixed(1)}°C`;
                        color = station.temp > 13.5 ? '#ff4757' : '#00f2fe';
                    } else if (activeMetric === 'wind') {
                        dispVal = `${station.wind}G${station.gust}`;
                        color = station.wind > 12 ? '#ff9f43' : '#00ff87';
                    } else if (activeMetric === 'rain') {
                        dispVal = `${station.rain.toFixed(1)}mm`;
                        color = station.rain > 0 ? '#00f2fe' : '#64748b';
                    }

                    // Tactical circular neon tracking marker custom design
                    const markerIcon = L.divIcon({
                        className: 'custom-pws-marker',
                        html: `<div style="background:${color}; width:8px; height:8px; border-radius:50%; box-shadow:0 0 8px ${color}; position:relative; left:-2px; top:-2px;"></div>
                               <div style="color:${color}; font-family:monospace; font-size:10px; font-weight:bold; background:rgba(18,24,32,0.85); padding:1px 4px; border-radius:3px; border:1px solid #1e2633; position:absolute; left:12px; top:-6px; white-space:nowrap;">${dispVal}</div>`
                    });

                    const marker = L.marker([station.lat, station.lng], { icon: markerIcon });
                    marker.bindPopup(`<strong style="color:#0a0e14">${station.name}</strong><br><span style="color:#64748b">ID: ${station.id}</span>`);
                    stationMarkersLayer.addLayer(marker);
                });
            }
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            container.innerHTML = '';

            for (const [sectorName, stations] of Object.entries(stationNetwork)) {
                const section = document.createElement('section');
                section.className = 'sector-section';

                const header = document.createElement('h2');
                header.className = 'sector-header';
                header.innerText = sectorName;
                                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid-matrix';

                stations.forEach(station => {
                    const card = document.createElement('div');
                    card.className = `pws-card ${station.stale ? 'stale' : ''}`;

                    let valStr = '';
                    let unitStr = '';

                    if (activeMetric === 'temp') {
                        valStr = station.temp.toFixed(1);
                        unitStr = '°C';
                    } else if (activeMetric === 'wind') {
                        valStr = `${station.wind}`;
                        unitStr = `G${station.gust} MPH`;
                    } else if (activeMetric === 'rain') {
                        valStr = station.rain.toFixed(1);
                        unitStr = 'MM';
                    }

                    card.innerHTML = `
                        <div class="pws-id">${station.id}</div>
                        <div class="pws-name" title="${station.name}">${station.name}</div>
                        <div class="metric-display">
                            <div class="metric-value">${valStr}</div>
                            <div class="metric-unit">${unitStr}</div>
                        </div>
                        <div class="pws-meta">
                            <span>ONLINE</span>
                            <span class="status-dot"></span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function switchMetric(metric) {
            activeMetric = metric;
            
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderMatrix();
            updateMapLayers();
        }

        window.onload = initMatrix;
    </script>
</body>
</html>
